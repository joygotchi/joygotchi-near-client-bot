[workspace]
resolver = "2"
members = ["joy-token", "pet-stake", "mint-router"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kurodenjiro/joygotchi-near-client-bot"

[workspace.dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = "symbols"
