[workspace]
resolver = "2"
members = ["game", "pet-stake", "mint-router"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kurodenjiro/joygotchi-near-client-bot"

[workspace.dependencies]
# `default` is just ["wee_alloc"], an unmaintained allocator that
# Dependabot flags as critical. Nothing here needs it.
near-sdk = { version = "5.30", default-features = false }
near-contract-standards = "5.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
debug-assertions = false
overflow-checks = true
strip = "symbols"
